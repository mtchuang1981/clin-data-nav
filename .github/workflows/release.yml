name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git fetch origin main:refs/remotes/origin/main
      - id: verify
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(python scripts/verify_release.py ref --tag "$TAG" --main-ref origin/main)"
          commit="$(git rev-parse "$TAG^{commit}")"
          tag_object="$(git rev-parse "$TAG^{tag}")"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse an existing Release and fail closed on API errors
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          status="$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $READ_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            404) ;;
            200) echo "Release already exists: $TAG" >&2; exit 1 ;;
            *) echo "GitHub Release lookup failed with HTTP $status" >&2; exit 1 ;;
          esac

  validate:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/validate_skill.py
      - run: python scripts/check_public_boundary.py
      - run: python scripts/package_skill.py --check-reproducible

  publish:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/package_skill.py
      - name: Verify immutable assets and tag identity
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.preflight.outputs.commit }}
          VERIFIED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
        run: |
          archive="dist/clinical-data-research-navigator-$VERSION.zip"
          manifest="dist/clinical-data-research-navigator-$VERSION.manifest.json"
          notes="docs/releases/$VERSION.md"
          test -f "$notes"
          python scripts/verify_release.py artifacts --archive "$archive" --manifest "$manifest"
          remote_refs="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          remote_tag_object=""
          remote_commit=""
          while IFS=$'\t' read -r object ref; do
            case "$ref" in
              "refs/tags/$TAG") remote_tag_object="$object" ;;
              "refs/tags/$TAG^{}") remote_commit="$object" ;;
            esac
          done <<< "$remote_refs"
          test -n "$remote_tag_object"
          test -n "$remote_commit"
          test "$remote_tag_object" = "$VERIFIED_TAG_OBJECT"
          test "$remote_commit" = "$VERIFIED_COMMIT"
      - name: Publish immutable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          archive="dist/clinical-data-research-navigator-$VERSION.zip"
          manifest="dist/clinical-data-research-navigator-$VERSION.manifest.json"
          notes="docs/releases/$VERSION.md"
          gh release create "$TAG" "$archive" "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$notes"
