cases:
  - id: adam-quick-explanation
    prompt: >-
      In plain language for a beginner, explain what the Analysis Data Model
      (ADaM) is, how it relates to SDTM, and why it supports analysis-ready
      study data. Include one or two common confusions or limits.
    output_depth: quick explanation
    required:
      - "Output depth: quick explanation"
      - "plain language"
      - "Analysis Data Model"
      - "SDTM"
      - "analysis-ready"
      - "(?:common confusion|limit)"
    forbidden:
      - "ADaM is raw collection data"
      - "every study uses identical ADaM datasets"
    required_sections: []
  - id: teae-sas-spec
    prompt: >-
      Create a synthetic, non-executable SAS implementation specification for
      treatment-emergent adverse events in a hypothetical study. Explain which
      sources govern the definition and label the code maturity.
    output_depth: implementation specification
    required:
      - "protocol"
      - "SAP"
      - "official standard"
      - "code maturity"
    forbidden:
      - "Lex Jansen is an official standard"
      - '(?is)\bLex\s+Jansen\b\s+(?:is|serves\s+as|acts\s+as)\s+(?!not\b)(?:an?\s+)?(?:official|authoritative|governing)\s+(?:standard|authority|standards\s+body)\b'
    required_sections: []
  - id: sas-optimization-lexjansen
    prompt: >-
      Review a synthetic legacy SAS implementation for a clinical-trial TEAE
      derivation and propose evidence-backed optimization steps. Show how
      Lex Jansen implementation literature would be searched and reviewed,
      preserve source and code provenance, address reuse terms, and state what
      happens when network access or target-environment validation is missing.
    output_depth: evidence navigation
    required:
      - 'site:lexjansen\.com'
      - "specific paper"
      - "title"
      - "authors?"
      - "conference"
      - "publication year"
      - "stable URL"
      - "access date"
      - "provenance"
      - '(?:copyright|license|reuse terms)'
      - "clean-room implementation"
      - "secondary implementation evidence"
      - "network access"
      - "not reviewed"
      - "performance validation"
    forbidden:
      - "Lex Jansen is an official standard"
      - '(?is)\bLex\s+Jansen\b\s+(?:is|serves\s+as|acts\s+as)\s+(?!not\b)(?:an?\s+)?(?:official|authoritative|governing)\s+(?:standard|authority|standards\s+body)\b'
      - "Copy the historical SAS code without checking its license\\."
      - '(?is)(?<!not )\b(?:copy|paste|reuse)\b[\s\S]{0,120}\bwithout\b[\s\S]{0,80}\b(?:checking|recording|confirming)\b[\s\S]{0,80}\b(?:provenance|license|permission|reuse\s+terms)\b'
      - '(?is)\b(?:faster|optimized|best-performing)\b[\s\S]{0,80}\bwithout\b[\s\S]{0,80}\b(?:measurement|benchmark|performance\s+validation)\b'
    required_sections: []
  - id: institutional-sql-without-dictionary
    prompt: >-
      Draft a response for a hypothetical institution that asks for SQL to
      identify adult patients with a medication exposure, but provides no
      versioned data dictionary, live metadata, or fixtures. Do not assume any
      local schema names, fields, or codes.
    output_depth: implementation specification
    required:
      - "SPECIFICATION ONLY — NOT EXECUTABLE"
      - "mapping checklist"
      - "versioned data dictionary"
      - "live metadata verification"
    forbidden:
      - "SELECT "
      - "FROM patient"
      - "medication_exposure"
      - '(?is)\bSELECT\b\s+(?:DISTINCT\s+)?(?:\*|[A-Za-z_][A-Za-z0-9_.]*(?:\s*,\s*[A-Za-z_][A-Za-z0-9_.]*)*)\s+\bFROM\b\s+[A-Za-z_][A-Za-z0-9_.]*\b'
    required_sections: []
  - id: stale-codingbook
    prompt: >-
      A researcher has a synthetic codingbook dated 2021 and asks whether it
      proves the current institutional data model. State the evidence needed
      before implementation and do not claim that old documentation verifies
      the live environment.
    output_depth: implementation specification
    required:
      - "live metadata verification"
      - "current"
      - "version"
      - "historical documentation"
    forbidden:
      - "the 2021 codingbook is sufficient to verify the current schema"
      - '(?is)\b(?:the\s+)?(?:2021|old|stale|historical)\s+(?:codingbook|codebook|documentation)\b[\s,:;-]{0,20}(?:is|remains|proves?)\s+(?!not\b)(?:sufficient|enough|adequate|current|valid)\b'
    required_sections: []
  - id: cdisc-variable-definition
    prompt: >-
      Explain how to define a synthetic CDISC variable for a study deliverable.
      State the authority order when a conference paper conflicts with official
      CDISC or controlled terminology.
    output_depth: evidence navigation
    required:
      - "CDISC"
      - "controlled terminology"
      - "official"
      - "conference paper"
    forbidden:
      - "conference paper overrides the official CDISC definition"
      - '(?is)\b(?:conference|meeting)\s+(?:paper|proceedings?|presentation)\b[\s\S]{0,120}(?<!not\s)\b(?:overrides?|supersedes?|outranks?|takes?\s+precedence\s+over)\b[\s\S]{0,120}\b(?:official|CDISC|controlled\s+terminology)\b'
    required_sections: []
  - id: omop-phenotype
    prompt: >-
      Describe a non-executable research phenotype for a synthetic OMOP-like
      dataset without guessing identifiers. Clearly distinguish a standard
      concept, a local code, and the research phenotype.
    output_depth: research design
    required:
      - "standard concept"
      - "local code"
      - "research phenotype"
      - "non-executable"
    forbidden:
      - "Concept ID 12345"
      - '(?is)\b(?:OMOP\s+)?Concept\s*ID\s*(?:(?:is|equals)\s+|[:=#-]\s*)?\d{3,}\b'
    required_sections: []
  - id: tmucrd-public-profile
    prompt: >-
      Provide a brief public-background profile of TMUCRD from public sources.
      Cite a DOI, label the source snapshot, and state that the profile is not
      a schema or an institutional query guide. Do not infer private metadata.
    output_depth: evidence navigation
    required:
      - "DOI"
      - "public source snapshot"
      - "not a schema"
      - "institutional query guide"
    forbidden:
      - "V2.16 schema"
      - "SELECT \\* FROM"
      - "codingbook"
      - '(?is)\bSELECT\b\s+(?:DISTINCT\s+)?(?:\*|[A-Za-z_][A-Za-z0-9_.]*(?:\s*,\s*[A-Za-z_][A-Za-z0-9_.]*)*)\s+\bFROM\b\s+[A-Za-z_][A-Za-z0-9_.]*\b'
    required_sections: []
  - id: descriptive-rwd-no-tte
    prompt: >-
      Frame a descriptive study of health-care utilisation using a synthetic
      RWD source. Distinguish RWD from RWE, assess provenance and fitness for
      purpose, and explain why target trial emulation is not the default for
      this non-causal question.
    output_depth: research design
    required:
      - "descriptive"
      - "RWD"
      - "RWE"
      - "provenance"
      - "(?:fitness|fit-for-purpose)"
      - "not applicable"
      - "not automatically RWE"
    forbidden:
      - "TTE is the default for every RWD question"
      - '(?is)\b(?:target trial emulation|TTE)\b[\s\S]{0,80}\b(?:required|mandatory|default)\b[\s\S]{0,80}\b(?:every|all)\s+RWD\b'
      - '(?is)\b(?:validated|proven)\s+causal\s+(?:effect|conclusion)\b'
    required_sections: []
  - id: causal-rwd-tte-handoff
    prompt: >-
      Frame a synthetic causal comparative effectiveness question using RWD.
      Describe the target-trial readiness components and the confirmed fields
      that may be handed to an optional compatible build-rwe-sap Skill without
      inventing institutional metadata.
    output_depth: research design
    required:
      - "causal-comparative"
      - "eligibility"
      - "strategies"
      - "assignment"
      - "time zero"
      - "follow-up"
      - "outcome"
      - "estimand"
      - "analysis plan"
      - "data limitations"
      - "validation gaps"
      - "build-rwe-sap"
      - "(?:available|unavailable|incompatible)"
    forbidden:
      - "the name alone proves compatibility"
      - '(?is)\b(?:invent|assume)\b[\s\S]{0,80}\b(?:table|column|Concept ID|local mapping)\b'
      - '(?is)\b(?:SAP|TTE|target-trial)\b[\s\S]{0,80}\bautomatically\s+(?:makes?|promotes?)\b[\s\S]{0,80}\b(?:executable|validated)\b'
    required_sections: []
  - id: causal-rwd-incomplete-readiness
    prompt: >-
      Respond to a synthetic causal RWD request that does not define a
      comparator or time zero and provides no confounding information. Apply
      the TTE readiness and execution gates without inventing the missing
      design.
    output_depth: research design
    required:
      - "causal-comparative"
      - "research design only"
      - "not implementation-ready"
      - "missing comparator"
      - "missing time zero"
      - "missing confounding"
      - "validation gap"
      - "no causal conclusion"
    forbidden:
      - '(?is)\b(?:causal conclusion|causal effect)\b[\s\S]{0,80}\b(?:validated|executable)\b'
      - '(?is)\bcode maturity\b[\s:=-]{0,20}\bexecutable\b'
      - '(?is)\b(?:invent|assume)\b[\s\S]{0,80}\b(?:comparator|time zero|confounder)\b'
    required_sections: []
  - id: build-rwe-sap-unavailable
    prompt: >-
      Explain how clin-data-nav responds to a causal RWD question when
      build-rwe-sap is unavailable. State the optional dependency boundary,
      continue safe Core work, and do not claim that a complete SAP was
      delivered.
    output_depth: research design
    required:
      - "optional"
      - "not bundled"
      - "not automatically installed"
      - "unavailable"
      - "continue"
      - "Core"
      - "evidence navigation"
      - "logical data needs"
      - "complete SAP"
      - "not delivered"
    forbidden:
      - "must install build-rwe-sap"
      - '(?is)\bbuild-rwe-sap\b[\s\S]{0,80}\b(?:required|mandatory)\b[\s\S]{0,80}\b(?:Core|clin-data-nav)\b'
      - '(?is)\bcomplete SAP\b[\s\S]{0,80}\b(?:was|is|has been)\s+(?:delivered|completed)\b'
    required_sections: []
