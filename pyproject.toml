[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[project]
name = "clin-data-nav"
version = "0.3.0"
requires-python = ">=3.11,<3.12"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
